<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="signal" id="signal" aria-hidden="true">
      <span class="lamp red" data-lamp="red"></span>
      <span class="lamp yellow" data-lamp="yellow"></span>
      <span class="lamp green" data-lamp="green"></span>
    </div>
    <div class="title-block">
      <h1 class="title">セーフサイン</h1>
      <p class="subtitle">仕事の文章を信号で安全チェック</p>
    </div>
  </header>

  <div class="verdict" id="verdict">
    <span class="verdict-label" id="verdictLabel">テキストを入力して判定</span>
  </div>

  <div class="controls">
    <textarea id="input" placeholder="募集文や仕事の説明文を貼り付けてください"></textarea>
    <div class="buttons">
      <button id="grabBtn" class="btn btn-sub">ページの選択範囲を取り込む</button>
      <button id="checkBtn" class="btn btn-main">判定する</button>
    </div>
  </div>

  <ul class="hits" id="hits"></ul>

  <p class="disclaimer">
    ルールベースの簡易チェックです。判定はあくまで目安で、最終的な判断はご自身で行ってください。
    入力した文章は端末内だけで処理され、外部に送信されません。
  </p>

  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
